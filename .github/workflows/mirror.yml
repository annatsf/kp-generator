name: mirror-sync

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4

      - name: Sync from upstream
        run: |
          set -e
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          # сохранить наш workflow, чтобы синк его не затёр
          mkdir -p /tmp/keep
          cp -a .github /tmp/keep/.github
          # свежая копия оригинала
          git clone --depth 1 https://github.com/EscoreOdessa/kp-generator.git /tmp/src
          rm -rf /tmp/src/.git
          # очистить рабочую папку (кроме .git) и залить свежие файлы
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/src/. .
          # вернуть наш workflow на место
          cp -a /tmp/keep/.github/. .github/
          git add -A
          if git diff --cached --quiet; then
            echo "Немає змін."
          else
            git commit -m "mirror: sync from EscoreOdessa/kp-generator @ $(date -u +%FT%TZ)"
            git push
          fi
